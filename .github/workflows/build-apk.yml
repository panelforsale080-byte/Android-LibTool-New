name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-LibTool-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (public download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          NAME=$(basename "$APK")
          cp "$APK" "/tmp/${NAME}"
          gh release delete "v3.3.1" -y 2>/dev/null || true
          gh release create "v3.3.1" \
            --title "Android LibTool v3.3.1" \
            --notes "Phone-optimized menu UI, FPS counter, responsive tabs. Debug APK for authorized testing." \
            "/tmp/${NAME}#${NAME}"
