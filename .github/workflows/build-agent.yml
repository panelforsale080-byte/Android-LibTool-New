name: Build IL2CPP Agent

on:
  push:
    branches:
      - feature/il2cpp-in-app-agent
    paths:
      - 'agent/**'
      - 'app/src/main/jni/Il2cpp/**'
      - 'app/src/main/jni/Includes/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure and build libil2cpp_agent.so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cmake -S agent/src/main/cpp -B build-agent -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-agent --verbose
          find build-agent -name 'libil2cpp_agent.so' -print
          file "$(find build-agent -name 'libil2cpp_agent.so' | head -n1)"

      - name: Upload libil2cpp_agent.so
        uses: actions/upload-artifact@v4
        with:
          name: libil2cpp_agent-arm64-v8a
          path: build-agent/libil2cpp_agent.so
          if-no-files-found: error
